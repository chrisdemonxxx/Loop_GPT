app = "loopit-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "8000"
  LOOPIT_ENV = "production"
  LOOPIT_PROJECTS = "/var/lib/loopit/projects"
  LOOPIT_ROUTER_URL = "http://loopit-router-svc.internal:8001"
  LOOPIT_EGRESS_PROXY_URL = "http://loopit-egress-proxy.internal:8002"
  LOOPIT_PREVIEW_PROXY_URL = "http://loopit-preview-proxy.internal:8003"
  LOOPIT_SCHEDULER_URL = "http://loopit-scheduler.internal:8004"
  HF_BASE_URL = "https://router.huggingface.co"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
