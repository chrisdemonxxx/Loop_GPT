app = "loopit-web"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PORT = "8080"
  LOOPIT_API_BASE_URL = "http://loopit-api.internal:8000"
  LOOPIT_PREVIEW_BASE_URL = "http://loopit-preview-proxy.internal:8003"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
