app = "loopit-egress-proxy"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "services/egress-proxy/Dockerfile"

[env]
  PORT = "8002"
  LOOPIT_EGRESS_PORT = "8002"

[checks.healthz]
  port = 8002
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
