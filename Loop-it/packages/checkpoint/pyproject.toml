[project]
name = "loopit-checkpoint"
version = "0.1.0"
description = "Immutable copy-on-write checkpoint tree for project filesystems, persisted off the sandbox VM."
requires-python = ">=3.11"
dependencies = [
    "loopit-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_checkpoint"]

[tool.uv.sources]
loopit-store = { workspace = true }
