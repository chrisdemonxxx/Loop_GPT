[project]
name = "loopit-enterprise"
version = "0.1.0"
description = "Enterprise readiness features for Loop-it."
requires-python = ">=3.11"
dependencies = [
    "loopit-auth",
    "loopit-store",
    "loopit-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_enterprise"]

[tool.uv.sources]
loopit-auth = { workspace = true }
loopit-store = { workspace = true }
loopit-telemetry = { workspace = true }
