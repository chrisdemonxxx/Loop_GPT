[project]
name = "loopit-provision"
version = "0.1.0"
description = "Schema provisioning for generated apps. Emits row-level security structurally (invariant I9)."
requires-python = ">=3.11"
dependencies = ["loopit-secrets-broker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_provision"]
