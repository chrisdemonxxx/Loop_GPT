[project]
name = "loopit-gitsync"
version = "0.1.0"
description = "Checkpoint-aligned Git sync and no-lock-in export for generated apps."
requires-python = ">=3.11"
dependencies = [
    "loopit-agent-core",
    "loopit-checkpoint",
    "loopit-secrets-broker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_gitsync"]

[tool.uv.sources]
loopit-checkpoint = { workspace = true }
loopit-secrets-broker = { workspace = true }
loopit-agent-core = { workspace = true }
