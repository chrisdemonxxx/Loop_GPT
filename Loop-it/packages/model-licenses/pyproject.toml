[project]
name = "loopit-model-licenses"
version = "0.1.0"
description = "Machine-readable per-model license register and commercial serving gate."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_model_licenses"]
artifacts = ["src/loopit_model_licenses/data/*.json"]
