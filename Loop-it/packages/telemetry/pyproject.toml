[project]
name = "loopit-telemetry"
version = "0.0.0"
description = "OpenTelemetry, metrics, structured logging, and audit WORM mirroring for Loop-it."
requires-python = ">=3.11,<3.15"
dependencies = [
    "loopit-agent-core",
    "loopit-store",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "starlette>=0.40",
]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_telemetry"]
