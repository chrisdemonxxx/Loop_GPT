[project]
name = "loopit-agent-core"
version = "0.1.0"
description = "Control-plane agent harness: budgets, audit, tool validation, and the ReAct loop."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_agent_core"]
