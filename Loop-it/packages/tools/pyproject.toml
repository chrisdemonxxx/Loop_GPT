[project]
name = "loopit-tools"
version = "0.1.0"
description = "Concrete least-privilege tool handlers for loopit-agent-core."
requires-python = ">=3.11"
dependencies = [
    "loopit-agent-core",
    "loopit-patch",
    "loopit-policy",
    "loopit-provision",
    "loopit-sandbox-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_tools"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-patch = { workspace = true }
loopit-policy = { workspace = true }
loopit-provision = { workspace = true }
loopit-sandbox-sdk = { workspace = true }
