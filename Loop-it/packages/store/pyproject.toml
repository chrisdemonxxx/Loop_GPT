[project]
name = "loopit-store"
version = "0.1.0"
description = "Control-plane persistence repositories and Postgres migrations."
requires-python = ">=3.11"
dependencies = [
    "loopit-agent-core",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
loopit-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_store"]
