[project]
name = "loopit-connectors"
version = "0.1.0"
description = "Per-project MCP-style connectors for Loop-it."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "loopit-agent-core",
    "loopit-auth",
    "loopit-policy",
    "loopit-secrets-broker",
    "loopit-store",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_connectors"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-auth = { workspace = true }
loopit-policy = { workspace = true }
loopit-secrets-broker = { workspace = true }
loopit-store = { workspace = true }

