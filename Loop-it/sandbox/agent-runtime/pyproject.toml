[project]
name = "loopit-agent-runtime"
version = "0.1.0"
description = "In-sandbox supervisor exposing Loop-it's signed data-plane RPC tool surface."
requires-python = ">=3.11"
dependencies = [
    "loopit-agent-core",
    "loopit-patch",
    "loopit-sandbox-sdk",
]

[project.scripts]
loopit-agent-runtime = "loopit_agent_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_agent_runtime"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-patch = { workspace = true }
loopit-sandbox-sdk = { workspace = true }
