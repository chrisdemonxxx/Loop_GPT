[project]
name = "loopit-workspace-dispatch"
version = "0.0.0"
description = "Workspace dispatcher: authorized tool execution in leased sandboxes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "loopit-agent-core",
    "loopit-agent-runtime",
    "loopit-checkpoint",
    "loopit-sandbox-sdk",
    "loopit-scheduler",
    "loopit-store",
    "loopit-telemetry",
    "loopit-tools",
    "loopit-verify",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
e2b = ["e2b-code-interpreter>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_workspace_dispatch"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-agent-runtime = { workspace = true }
loopit-checkpoint = { workspace = true }
loopit-sandbox-sdk = { workspace = true }
loopit-scheduler = { workspace = true }
loopit-store = { workspace = true }
loopit-telemetry = { workspace = true }
loopit-tools = { workspace = true }
loopit-verify = { workspace = true }
