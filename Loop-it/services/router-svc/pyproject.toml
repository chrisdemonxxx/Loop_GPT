[project]
name = "loopit-router"
version = "0.1.0"
description = "Model router: task-difficulty routing, per-tenant quota, server-side credential injection, cost attribution."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "loopit-agent-core",
    "loopit-auth",
    "loopit-model-licenses",
    "loopit-store",
    "loopit-telemetry",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_router"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-auth = { workspace = true }
loopit-model-licenses = { workspace = true }
loopit-store = { workspace = true }
loopit-telemetry = { workspace = true }
