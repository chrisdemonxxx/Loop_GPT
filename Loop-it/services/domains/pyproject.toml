[project]
name = "loopit-domains"
version = "0.1.0"
description = "Per-project subdomains, custom-domain verification, certificate lifecycle seams, and registrar seams."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "loopit-agent-core",
    "loopit-auth",
    "loopit-telemetry",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_domains"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-auth = { workspace = true }
loopit-telemetry = { workspace = true }
