[project]
name = "loopit-egress"
version = "0.1.0"
description = "Default-deny egress policy engine for sandbox leases (invariants I3, I4)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "loopit-agent-core",
    "loopit-store",
    "loopit-telemetry",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_egress"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-store = { workspace = true }
loopit-telemetry = { workspace = true }
