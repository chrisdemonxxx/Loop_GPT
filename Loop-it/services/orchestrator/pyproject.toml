[project]
name = "loopit-orchestrator"
version = "0.0.0"
description = "Temporal-backed durable run orchestration for Loop-it."
requires-python = ">=3.11"
dependencies = [
    "loopit-agent-core",
    "loopit-planner",
    "loopit-policy",
    "loopit-sandbox-sdk",
    "loopit-tools",
    "temporalio>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_orchestrator"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-planner = { workspace = true }
loopit-policy = { workspace = true }
loopit-sandbox-sdk = { workspace = true }
loopit-tools = { workspace = true }
