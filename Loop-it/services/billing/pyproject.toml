[project]
name = "loopit-billing"
version = "0.1.0"
description = "Credit ledger, metering, plan limits, and Stripe synchronization for Loop-it."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "loopit-agent-core",
    "loopit-auth",
    "loopit-policy",
    "loopit-store",
    "loopit-telemetry",
    "stripe>=10.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_billing"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-auth = { workspace = true }
loopit-policy = { workspace = true }
loopit-store = { workspace = true }
loopit-telemetry = { workspace = true }
