[project]
name = "loopit-mcp"
version = "0.1.0"
description = "MCP server wrapping the Loop-it FastAPI control plane for portal agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "loopit-telemetry",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_mcp"]

[tool.uv.sources]
loopit-telemetry = { workspace = true }
