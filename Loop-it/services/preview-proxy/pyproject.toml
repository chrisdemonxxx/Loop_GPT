[project]
name = "loopit-preview"
version = "0.1.0"
description = "Authenticated per-project preview routing; sandbox ports are never public (I1, I4)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=0.29",
    "loopit-agent-core",
    "loopit-store",
    "loopit-telemetry",
    "uvicorn>=0.30",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_preview"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
loopit-store = { workspace = true }
loopit-telemetry = { workspace = true }
