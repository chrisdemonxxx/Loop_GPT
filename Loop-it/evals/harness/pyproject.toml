[project]
name = "loopit-evals"
version = "0.1.0"
description = "The eval harness: tiered task suite, deterministic scoring, cost attribution."
requires-python = ">=3.11"
dependencies = [
    "loopit-agent-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopit_evals"]

[tool.uv.sources]
loopit-agent-core = { workspace = true }
