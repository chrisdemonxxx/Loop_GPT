# Render blueprint for the Loop GPT backend + Postgres.
# Deploy: push to GitHub, then in Render → "New +" → "Blueprint" and select this repo.
# Secrets marked `sync: false` must be filled in the Render dashboard after creation.
services:
  - type: web
    name: loop-gpt-backend
    env: node
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    buildCommand: npm ci && npm run generate && npm run build
    # Apply reviewed migrations and initialize private storage separately before
    # startup. Never reset/baseline an existing database from this manifest.
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRIVATE_FILES_STORAGE_MODE
        value: shared-filesystem
      - key: PRIVATE_FILES_DIR
        value: /opt/render/project/src/backend/data/private-files
      - key: PRIVATE_FILES_STORE_ID
        sync: false
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: loop-gpt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # ---- Model backend (fill these in the dashboard) ----
      - key: HF_ENDPOINT_URL   # your dedicated endpoint URL, or https://router.huggingface.co
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: tgi
      - key: DEFAULT_PROVIDER
        value: huggingface
      - key: HF_IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: HF_IMAGE_PROVIDER
        value: nscale
      # ---- Guardrails (keep on in production) ----
      - key: GUARDRAILS_ENABLED
        value: "true"
      - key: REVEAL_MODEL
        value: "false"
      # Dev auth bypass MUST stay off in production.
      - key: ENABLE_DEV_MODE
        value: "false"
      # ---- Optional ----
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    # This single-service volume is not shared across independent worker services.
    disk:
      name: loop-gpt-disk
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

databases:
  - name: loop-gpt-db
    plan: free
    databaseName: loopgpt
    user: loopgpt
