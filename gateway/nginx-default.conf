# Loop GPT web gateway — landing + LibreChat reverse proxy
# __DNS__ is substituted at container start from /etc/resolv.conf.
resolver __DNS__ valid=10s ipv6=off;

upstream lc_backend {
    # 'resolve' keeps the gateway immune to LibreChat redeploys/IP churn
    server librechat.railway.internal:3080 resolve;
    zone lc_zone 64k;
}

server {
    listen 3000;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Landing page (static mirror of former Next.js portal)
    location = / {
        try_files /index.html =404;
    }

    # Mirrored landing assets (prefixed to avoid clashing with LibreChat's /_next/)
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
    }

    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    # Friendly aliases into LibreChat
    location = /signup {
        return 302 /register$is_args$args;
    }
    location = /legal {
        return 302 /terms;
    }

    # Everything else -> LibreChat (Node server, includes /login /register /oauth/*)
    location / {
        proxy_pass http://lc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # SSE / streaming chat responses
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache off;
    }
}
