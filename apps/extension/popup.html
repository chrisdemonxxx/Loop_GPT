<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Loop GPT</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 280px; color: #1c1917; background: #fafaf9; }
      main { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { margin: 0 0 10px; color: #57534e; }
      label { display: block; font-size: 11px; color: #78716c; margin: 8px 0 4px; }
      input { width: 100%; box-sizing: border-box; border: 1px solid #d6d3d1; border-radius: 8px; padding: 6px 8px; }
      button { margin-top: 10px; width: 100%; border: 0; border-radius: 8px; padding: 8px; background: #c96442; color: white; }
      button:disabled { background: #d6d3d1; color: #78716c; }
      .status { margin-top: 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Connect to Loop</h1>
      <p>Paste the code from Settings → Connectors. The window stays visible.</p>
      <label for="code">Pair code</label>
      <input id="code" autocomplete="off" />
      <label for="profile">Profile label (optional, for an Octo profile you already started)</label>
      <input id="profile" autocomplete="off" />
      <label for="origin">Loop API</label>
      <input id="origin" value="http://localhost:3001" />
      <button id="connect" type="button">Connect to Loop</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
