# envsubst is restricted to operator variables; nginx request variables survive.
map $uri $owned_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api(?:/|$) "no-store";
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 75m;

    add_header Cache-Control $owned_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "owned-web\n"; }
    location = /sw.js { try_files $uri =404; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/api(?:/|$) {
        # Fixed validated operator target. Never derive an upstream from Host,
        # Origin, a request argument, or a browser-supplied header.
        resolver ${API_RESOLVER} valid=10s ipv6=on;
        resolver_timeout 5s;
        set $owned_api "${API_UPSTREAM}";
        proxy_pass $owned_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "${API_HOST}";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_ssl_server_name on;
        proxy_ssl_name "${API_TLS_NAME}";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_connect_timeout 10s;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        gzip off;
        access_log off;
    }
    location ^~ /v1/ {
        # Developer OpenAI-compatible API. Same fixed validated target; SSE
        # streaming must not buffer. Mirrors the /api block deliberately.
        resolver ${API_RESOLVER} valid=10s ipv6=on;
        resolver_timeout 5s;
        set $owned_api "${API_UPSTREAM}";
        proxy_pass $owned_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "${API_HOST}";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_ssl_server_name on;
        proxy_ssl_name "${API_TLS_NAME}";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_connect_timeout 10s;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        gzip off;
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
