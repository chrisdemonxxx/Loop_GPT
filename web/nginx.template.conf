# envsubst is restricted to operator variables; nginx request variables survive.
map $uri $owned_cache_control {
    default "no-cache";
    ~^/(?:assets|_next/static)/ "public, max-age=31536000, immutable";
    ~^/api(?:/|$) "no-store";
    # The served-revision marker (contract §F) answers the same acceptance field
    # as GET /api/version, so it must carry the same cache semantics. A `map`
    # entry, NOT a `location` with `add_header Cache-Control`: a location-level
    # add_header replaces the server-level set below and would silently drop
    # nosniff/CSP/Referrer-Policy/X-Frame-Options/Permissions-Policy on this
    # one path. The regex is anchored to the exact path so /version.json.bak
    # keeps the default.
    ~^/version\.json$ "no-store";
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 75m;
    # The app is served behind a TLS terminator (Railway/Cloudflare) on this
    # container port; an absolute directory redirect would leak the internal
    # scheme/port (e.g. http://host:8080/login/). Emit relative redirects.
    absolute_redirect off;
    port_in_redirect off;
    # The platform edge appends the client address to X-Forwarded-For; with
    # recursion off nginx takes that last (edge-written) entry, so a client
    # cannot choose its own $remote_addr. This container is reachable only
    # through the edge.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $owned_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Next's static export bootstraps with inline <script> flight data and inline
    # style attributes; 'unsafe-inline' is required for hydration. PostHog
    # (product analytics) loads its lazy recorder from the US assets CDN and
    # posts captures to the US API; Sentry reports to its ingest endpoint.
    # Everything else stays same-origin and locked down.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://us.i.posthog.com https://us-assets.i.posthog.com; font-src 'self' data:; connect-src 'self' https://us.i.posthog.com https://us-assets.i.posthog.com https://*.ingest.sentry.io; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "owned-web\n"; }
    location = /sw.js { try_files $uri =404; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/api(?:/|$) {
        # Fixed validated operator target. Never derive an upstream from Host,
        # Origin, a request argument, or a browser-supplied header.
        resolver ${API_RESOLVER} valid=10s ipv6=on;
        resolver_timeout 5s;
        set $owned_api "${API_UPSTREAM}";
        proxy_pass $owned_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "${API_HOST}";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        # Proves to the backend that X-Forwarded-For was written by this proxy
        # (always overwrites any client-sent value; omitted when unset).
        proxy_set_header X-Loop-Proxy-Auth "${PROXY_SHARED_SECRET}";
        proxy_ssl_server_name on;
        proxy_ssl_name "${API_TLS_NAME}";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_connect_timeout 10s;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        gzip off;
        access_log off;
    }
    location ^~ /v1/ {
        # Developer OpenAI-compatible API. Same fixed validated target; SSE
        # streaming must not buffer. Mirrors the /api block deliberately.
        resolver ${API_RESOLVER} valid=10s ipv6=on;
        resolver_timeout 5s;
        set $owned_api "${API_UPSTREAM}";
        proxy_pass $owned_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host "${API_HOST}";
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Loop-Proxy-Auth "${PROXY_SHARED_SECRET}";
        proxy_ssl_server_name on;
        proxy_ssl_name "${API_TLS_NAME}";
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_connect_timeout 10s;
        proxy_next_upstream off;
        proxy_ignore_client_abort off;
        gzip off;
        access_log off;
    }
    # Real 404s (blueprint §4.3 parity): every app route has its own
    # index.html from the static export, so the SPA fallback only ever served
    # UNKNOWN paths the landing page with a 200 — the §6.2 probe hazard.
    # Unknown paths now get the exported 404 page with the correct status.
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
}
