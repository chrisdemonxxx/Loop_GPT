title = "Loop GPT release secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Exact synthetic Stripe fixtures; tests forbid all external effects"
condition = "AND"
paths = ['''(^|/)backend/src/services/__tests__/paymentIngress\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^sk_(test|live)_localFixtureOnly$''']

[[allowlists]]
description = "Exact public Cloudflare beacon site ID already shipped in gateway HTML; not authentication"
condition = "AND"
paths = ['''(^|/)gateway/site/index\.html$''']
regexTarget = "secret"
regexes = ['''^cbb60ef88b6d459c971f26e5e03487ec$''']
