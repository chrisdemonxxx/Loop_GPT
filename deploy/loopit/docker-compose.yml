# Minimal Loop-IT stack for the Loop-GPT side-by-side deploy.
# Build context is the nested Loop-it/ tree. This file does not start Temporal
# and does not create cloud resources. See README.md before pointing Railway
# at it.
#
# Scheduler is LOOPIT_SANDBOX_PROVIDER=e2b (no Docker socket). Durable runs are
# off (LOOPIT_RUN_EXECUTION_MODE=local). Set LOOPIT_TEMPORAL_ADDRESS and switch
# the mode to orchestrator when either Temporal Cloud or a self-hosted frontend
# is ready; both use the same three LOOPIT_TEMPORAL_* variables.

name: loopit-sidebyside

x-python-healthcheck: &python-healthcheck
  interval: 30s
  timeout: 5s
  start_period: 20s
  retries: 3

services:
  migrate:
    build:
      context: ../../Loop-it
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL with search_path=loopit}
      LOOPIT_AUDIT_ROLE_PASSWORD: ${LOOPIT_AUDIT_ROLE_PASSWORD:?set LOOPIT_AUDIT_ROLE_PASSWORD}
    command: ['sh', '-c', 'python -m loopit_store.migrate --dsn "$${DATABASE_URL}"']
    restart: 'no'
    networks:
      - control-plane

  router-svc:
    build:
      context: ../../Loop-it
      dockerfile: services/router-svc/Dockerfile
    environment:
      PORT: ${ROUTER_PORT:-8001}
      LOOPIT_ROUTER_PORT: ${ROUTER_PORT:-8001}
      LOOPIT_LEASE_TOKEN_SECRET: ${LOOPIT_LEASE_TOKEN_SECRET:?set LOOPIT_LEASE_TOKEN_SECRET}
      LOOPIT_MODEL_UPSTREAM_BASE_URL: ${LOOPIT_MODEL_UPSTREAM_BASE_URL:-https://router.huggingface.co}
      LOOPIT_ROUTER_POLICY: ${LOOPIT_ROUTER_POLICY:-huggingface}
      LOOPIT_MODEL_API_KEY: ${LOOPIT_MODEL_API_KEY:?set LOOPIT_MODEL_API_KEY}
      HF_BILL_TO: ${HF_BILL_TO:-}
      LOOPIT_STORE_DSN: ${LOOPIT_STORE_DSN:-${DATABASE_URL}}
      LOOPIT_IDENTITY_ISSUER: ${LOOPIT_IDENTITY_ISSUER:-loopit-gateway}
      LOOPIT_IDENTITY_AUDIENCE: ${LOOPIT_IDENTITY_AUDIENCE:-loopit-control-plane}
      LOOPIT_IDENTITY_KID: ${LOOPIT_IDENTITY_KID:-dev}
      LOOPIT_IDENTITY_SECRET: ${LOOPIT_IDENTITY_SECRET:?set LOOPIT_IDENTITY_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *python-healthcheck
      test:
        [
          'CMD-SHELL',
          'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:%s/healthz'' % os.environ.get(''PORT'', ''8001''), timeout=3).read()"',
        ]
    networks:
      - control-plane

  scheduler:
    build:
      context: ../../Loop-it
      dockerfile: services/scheduler/Dockerfile
    environment:
      PORT: ${SCHEDULER_PORT:-8004}
      LOOPIT_SCHEDULER_PORT: ${SCHEDULER_PORT:-8004}
      LOOPIT_LEASE_TOKEN_SECRET: ${LOOPIT_LEASE_TOKEN_SECRET:?set LOOPIT_LEASE_TOKEN_SECRET}
      LOOPIT_SERVICE_TOKEN: ${LOOPIT_SERVICE_TOKEN:?set LOOPIT_SERVICE_TOKEN}
      LOOPIT_SANDBOX_PROVIDER: e2b
      LOOPIT_E2B_TEMPLATE_ID: ${LOOPIT_E2B_TEMPLATE_ID:?set LOOPIT_E2B_TEMPLATE_ID}
      E2B_API_KEY: ${E2B_API_KEY:?set E2B_API_KEY}
      LOOPIT_SCHEDULER_STORE_DSN: ${LOOPIT_SCHEDULER_STORE_DSN:-${DATABASE_URL}}
      LOOPIT_AUDIT_DSN: ${LOOPIT_AUDIT_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *python-healthcheck
      test:
        [
          'CMD-SHELL',
          'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:%s/healthz'' % os.environ.get(''PORT'', ''8004''), timeout=3).read()"',
        ]
    networks:
      - control-plane

  preview-proxy:
    build:
      context: ../../Loop-it
      dockerfile: services/preview-proxy/Dockerfile
    environment:
      PORT: ${PREVIEW_PROXY_PORT:-8003}
      LOOPIT_PREVIEW_PORT: ${PREVIEW_PROXY_PORT:-8003}
      LOOPIT_PREVIEW_SIGNING_KEY: ${LOOPIT_PREVIEW_SIGNING_KEY:?set LOOPIT_PREVIEW_SIGNING_KEY}
      LOOPIT_PREVIEW_DOMAIN: ${LOOPIT_PREVIEW_DOMAIN:-.preview.loopit.dev}
      LOOPIT_PREVIEW_ROUTES: ${LOOPIT_PREVIEW_ROUTES:-[]}
      LOOPIT_AUDIT_DSN: ${LOOPIT_AUDIT_DSN:?set LOOPIT_AUDIT_DSN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *python-healthcheck
      test:
        [
          'CMD-SHELL',
          'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:%s/healthz'' % os.environ.get(''PORT'', ''8003''), timeout=3).read()"',
        ]
    networks:
      - control-plane

  api:
    build:
      context: ../../Loop-it
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: ${API_PORT:-8000}
      LOOPIT_ENV: ${LOOPIT_ENV:-production}
      LOOPIT_DEV_SINGLE_TENANT: '0'
      LOOPIT_RUN_EXECUTION_MODE: ${LOOPIT_RUN_EXECUTION_MODE:-local}
      LOOPIT_TEMPORAL_ADDRESS: ${LOOPIT_TEMPORAL_ADDRESS:-}
      LOOPIT_TEMPORAL_NAMESPACE: ${LOOPIT_TEMPORAL_NAMESPACE:-default}
      LOOPIT_TEMPORAL_TASK_QUEUE: ${LOOPIT_TEMPORAL_TASK_QUEUE:-loopit-runs}
      LOOPIT_STORE_DSN: ${LOOPIT_STORE_DSN:-${DATABASE_URL}}
      LOOPIT_ROUTER_URL: ${LOOPIT_ROUTER_URL:-http://router-svc:8001}
      LOOPIT_PREVIEW_PROXY_URL: ${LOOPIT_PREVIEW_PROXY_URL:-http://preview-proxy:8003}
      LOOPIT_SCHEDULER_URL: ${LOOPIT_SCHEDULER_URL:-http://scheduler:8004}
      LOOPIT_IDENTITY_ISSUER: ${LOOPIT_IDENTITY_ISSUER:-loopit-gateway}
      LOOPIT_IDENTITY_AUDIENCE: ${LOOPIT_IDENTITY_AUDIENCE:-loopit-control-plane}
      LOOPIT_IDENTITY_KID: ${LOOPIT_IDENTITY_KID:-dev}
      LOOPIT_IDENTITY_SECRET: ${LOOPIT_IDENTITY_SECRET:?set LOOPIT_IDENTITY_SECRET}
      LOOPIT_PREVIEW_SIGNING_KEY: ${LOOPIT_PREVIEW_SIGNING_KEY:?set LOOPIT_PREVIEW_SIGNING_KEY}
      LOOPIT_PROJECTS: ${LOOPIT_PROJECTS:-/var/lib/loopit/projects}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_BASE_URL: ${HF_BASE_URL:-https://router.huggingface.co}
      HF_BILL_TO: ${HF_BILL_TO:-}
    volumes:
      - loopit-projects:/var/lib/loopit/projects
    depends_on:
      migrate:
        condition: service_completed_successfully
      router-svc:
        condition: service_healthy
      scheduler:
        condition: service_healthy
      preview-proxy:
        condition: service_healthy
    healthcheck:
      <<: *python-healthcheck
      test:
        [
          'CMD-SHELL',
          'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:%s/api/health'' % os.environ.get(''PORT'', ''8000''), timeout=3).read()"',
        ]
    networks:
      - control-plane

volumes:
  loopit-projects:

networks:
  control-plane:
