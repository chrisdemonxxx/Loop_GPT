name: Owned web validation

on:
  pull_request:
    paths: ['web/**', 'frontend/**', '.github/workflows/web-validation.yml']
  push:
    paths: ['web/**', 'frontend/**', '.github/workflows/web-validation.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node build/pwa.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npx --no-install playwright test

  # NOTE: the former `web-harness` job (Vite/React-19 alternative client in
  # web/src) was removed when that client was archived to attic/web-vite-client.
  # web/ still contains the live deployment path: Dockerfile + nginx.template.conf
  # + railway.json build the Next.js frontend/ static export and proxy /api + /v1.
  owned-web-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate owned-web deployment files (nginx template + entrypoint present)
        run: |
          test -f web/Dockerfile
          test -f web/nginx.template.conf
          test -f web/Dockerfile.dockerignore
          test -f web/railway.json
