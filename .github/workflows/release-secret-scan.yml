name: Release secret scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  candidate-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan the complete candidate tree, not local state or Git history
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/candidate.tar" HEAD
          docker run --rm --network none \
            --mount "type=bind,source=$RUNNER_TEMP/candidate.tar,target=/candidate.tar,readonly" \
            --mount "type=bind,source=$PWD/.gitleaks.toml,target=/scan.toml,readonly" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            dir /candidate.tar --config /scan.toml --max-archive-depth 1 --redact --no-banner
